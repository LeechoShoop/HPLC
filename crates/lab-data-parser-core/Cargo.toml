[package]
name = "lab-data-parser-core"
version = "0.1.0"
edition = "2024"

[lib]
name = "lab_data_parser_core"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
csv = "1"
plotters = "0.3"
quick-xml = "0.36"
base64 = "0.22"
flate2 = "1"
rust_xlsxwriter = "0.80"
encoding_rs = "0.8.42"
